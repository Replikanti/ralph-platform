name: Deploy to GKE

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER_NAME }}
  GKE_ZONE: ${{ secrets.GKE_ZONE }}
  IMAGE: ralph

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    # Authenticate to GCP using Workload Identity
    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v3'
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v3'

    - name: 'Use gcloud CLI'
      run: 'gcloud info'

    # Configure Docker to use the gcloud command-line tool as a credential
    # helper for authentication
    - run: |-
        gcloud --quiet auth configure-docker

    # Build the Docker image
    - name: Build
      run: |-
        docker build \
          --tag "gcr.io/$PROJECT_ID/$IMAGE:$GITHUB_SHA" \
          --build-arg GITHUB_SHA="$GITHUB_SHA" \
          --build-arg GITHUB_REF="$GITHUB_REF" \
          .

    # Push the Docker image to Google Container Registry
    - name: Publish
      run: |-
        docker push "gcr.io/$PROJECT_ID/$IMAGE:$GITHUB_SHA"

    # Set up GKE credentials
    - uses: google-github-actions/get-gke-credentials@v3
      with:
        cluster_name: ${{ env.GKE_CLUSTER }}
        location: ${{ env.GKE_ZONE }}

    # Push Claude Max credentials to GCP Secret Manager.
    # Add CLAUDE_CREDENTIALS_N in GitHub Actions secrets to activate account N.
    # Slots 0-3 are pre-created in Terraform. Values are only pushed when non-empty.
    - name: Push Claude credentials to GCP Secret Manager
      env:
        CLAUDE_CREDENTIALS_0: ${{ secrets.CLAUDE_CREDENTIALS_0 }}
        CLAUDE_CREDENTIALS_1: ${{ secrets.CLAUDE_CREDENTIALS_1 }}
        CLAUDE_CREDENTIALS_2: ${{ secrets.CLAUDE_CREDENTIALS_2 }}
        CLAUDE_CREDENTIALS_3: ${{ secrets.CLAUDE_CREDENTIALS_3 }}
      run: |-
        for i in 0 1 2 3; do
          eval "CREDS=\$CLAUDE_CREDENTIALS_${i}"
          if [ -n "$CREDS" ]; then
            echo "Pushing account-${i} credentials to GCP Secret Manager..."
            printf '%s' "$CREDS" | gcloud secrets versions add "ralph-claude-credentials-${i}" --data-file=-
          fi
        done

    # Install Helm
    - name: Install Helm
      uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

    # Deploy via Helm
    - name: Deploy
      run: |-
        helm upgrade --install ralph ./helm/ralph \
          --set image.repository=gcr.io/$PROJECT_ID/$IMAGE \
          --set image.tag=$GITHUB_SHA \
          --set redis.existingSecret=ralph-redis-secret \
          --set ingress.enabled=true \
          --values helm/ralph/values.yaml
