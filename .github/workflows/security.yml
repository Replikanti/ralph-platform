name: Security Audit

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Architecture invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.x"
      - run: bun install --frozen-lockfile
      - name: Verify security architecture invariants
        run: bun test tests/security-architecture.test.ts

  data-flow:
    name: PII redaction data flow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.x"
      - run: bun install --frozen-lockfile
      - name: Verify secrets are redacted before entering the queue
        run: bun test tests/server.test.ts
