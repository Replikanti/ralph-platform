{{- if .Values.externalSecrets.enabled }}
---
# GitHub Token
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "ralph.fullname" . }}-github-token
  labels:
    {{- include "ralph.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ include "ralph.fullname" . }}-gcpsm
    kind: SecretStore
  target:
    name: ralph-github-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: ralph-github-token

---
# Langfuse
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "ralph.fullname" . }}-langfuse
  labels:
    {{- include "ralph.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ include "ralph.fullname" . }}-gcpsm
    kind: SecretStore
  target:
    name: ralph-langfuse
    creationPolicy: Owner
  data:
    - secretKey: publicKey
      remoteRef:
        key: ralph-langfuse-public-key
    - secretKey: secretKey
      remoteRef:
        key: ralph-langfuse-secret-key
    - secretKey: host
      remoteRef:
        key: ralph-langfuse-host

---
# Linear Webhook Secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "ralph.fullname" . }}-linear-secret
  labels:
    {{- include "ralph.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ include "ralph.fullname" . }}-gcpsm
    kind: SecretStore
  target:
    name: ralph-linear-secret
    creationPolicy: Owner
  data:
    - secretKey: webhook-secret
      remoteRef:
        key: ralph-linear-webhook-secret
    - secretKey: api-key
      remoteRef:
        key: ralph-linear-api-key

---
# Admin Credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "ralph.fullname" . }}-admin-creds
  labels:
    {{- include "ralph.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ include "ralph.fullname" . }}-gcpsm
    kind: SecretStore
  target:
    name: ralph-admin-creds
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: ralph-admin-pass

---
# Redis URL
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "ralph.fullname" . }}-redis-secret
  labels:
    {{- include "ralph.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ include "ralph.fullname" . }}-gcpsm
    kind: SecretStore
  target:
    name: ralph-redis-secret
    creationPolicy: Owner
  data:
    - secretKey: redis-url
      remoteRef:
        key: ralph-redis-url

{{- if .Values.claudeAccounts.enabled }}
{{- range .Values.claudeAccounts.externalSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .k8sSecretName }}
  labels:
    {{- include "ralph.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ include "ralph.fullname" $ }}-gcpsm
    kind: SecretStore
  target:
    name: {{ .k8sSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: credentials.json
      remoteRef:
        key: {{ .gcpSecretName }}
{{- end }}
{{- end }}
{{- end }}
